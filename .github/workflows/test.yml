name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Unit tests
        run: bash tests/run.sh
      - name: ShellCheck
        run: shellcheck -x deploy.sh add-client.sh remove-client.sh status.sh backup.sh cleanup.sh rollback.sh lib/common.sh tests/*.sh
